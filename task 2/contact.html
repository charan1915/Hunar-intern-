<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunar-intern | Contact Support</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">Hunar-intern</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 style="text-align: center; margin-bottom: 1rem;">Get in Touch With Us</h1>
        
        <form action="#" method="POST" onsubmit="alert('Your inquiry has been submitted successfully!'); return false;">
            <div class="form-group">
                <label for="contact-name">Name</label>
                <input type="text" id="contact-name" required placeholder="Your Name">
            </div>

            <div class="form-group">
                <label for="contact-email">Email Address</label>
                <input type="email" id="contact-email" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label for="message">Message / Inquiry Details</label>
                <textarea id="message" rows="5" required placeholder="Type your context or request options here..."></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Hunar-intern Project Submission. Built for Hunar Intern Program.</p>
    </footer>

</body>
</html>
