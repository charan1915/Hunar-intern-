<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunar-intern | Course Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">Hunar-intern</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 style="text-align: center; margin-bottom: 1rem;">Course Registration Form</h1>
        
        <form action="#" method="POST" onsubmit="alert('Registration processing simulated successfully!'); return false;">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required placeholder="Your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="yourname@example.com">
            </div>

            <div class="form-group">
                <label for="course">Select Target Course Domain</label>
                <select id="course" name="course" required>
                    <option value="">-- Choose a Track --</option>
                    <option value="webdev">Web Development BootCamp</option>
                    <option value="iot">IoT & Embedded Engineering</option>
                    <option value="backend">Backend Architecture (PHP & SQL)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="experience">Prior Technical Background</label>
                <select id="experience" name="experience">
                    <option value="beginner">Beginner (No past experience)</option>
                    <option value="intermediate">Intermediate (Understand simple syntax)</option>
                </select>
            </div>

            <button type="submit">Submit Registration</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Hunar-intern Project Submission. Built for Hunar Intern Program.</p>
    </footer>

</body>
</html>
